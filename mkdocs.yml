site_name: Easy IDP
site_description: GitOps-native Internal Developer Platform
site_url: https://buckinghamio.github.io/easy-idp-docs/
repo_url: https://github.com/BuckinghamIO/easy-idp
repo_name: BuckinghamIO/easy-idp
edit_uri: https://github.com/BuckinghamIO/easy-idp-docs/edit/main/docs/

theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: Roboto Mono
  features:
    # Navigation
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Table of contents
    - toc.follow
    - toc.integrate
    # Content
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    logo: material/rocket-launch
  # Uncomment when you have custom logo/favicon:
  # logo: assets/logo.svg
  # favicon: assets/favicon.png

plugins:
  - search

extra:
  homepage: https://buckinghamio.github.io/easy-idp-docs/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BuckinghamIO/easy-idp
      name: Easy IDP on GitHub
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/buckinghamio/easy-idp
      name: Docker Hub
  generator: false
  
extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - First Workflow: getting-started/first-workflow.md
  - Workflows:
      - Overview: workflows/overview.md
      - Action Primitives: workflows/action-primitives.md
      - Creating Workflows: workflows/creating-workflows.md
      - Examples: workflows/examples.md
  - GitOps:
      - Overview: gitops/overview.md
      - Setup Guide: gitops/setup.md
      - Repository Structure: gitops/repository-structure.md
      - Troubleshooting: gitops/troubleshooting.md
  - Features:
      - Global Variables: features/global-variables.md
      - Credentials: features/credentials.md
      - Templates: features/templates.md
  - Schema Reference:
      - Overview: schemas/overview.md
      - Service: schemas/service.md
      - Team: schemas/team.md
      - Workflow: schemas/workflow.md
      - Scorecard: schemas/scorecard.md
      - Examples: schemas/examples.md
      - Versioning: schemas/versioning.md
  - API Reference:
      - Authentication: api/authentication.md
      - Workflows: api/workflows.md
      - Runs: api/runs.md
  - Guides:
      - Deploy to Kubernetes: guides/kubernetes-deploy.md
      - DNS Automation: guides/dns-automation.md
      - Database Provisioning: guides/database-provisioning.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
