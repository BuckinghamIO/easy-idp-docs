site_name: Easy IDP Documentation
site_url: https://buckinghamio.github.io/easy-idp-docs/
repo_url: https://github.com/BuckinghamIO/easy-idp
repo_name: easy-idp
edit_uri: https://github.com/BuckinghamIO/easy-idp-docs/edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BuckinghamIO/easy-idp
      name: Easy IDP on GitHub

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - First Workflow: getting-started/first-workflow.md
  - Workflows:
      - Overview: workflows/overview.md
      - Action Primitives: workflows/action-primitives.md
      - Creating Workflows: workflows/creating-workflows.md
      - Examples: workflows/examples.md
  - GitOps:
      - Overview: gitops/overview.md
      - Setup Guide: gitops/setup.md
      - Repository Structure: gitops/repository-structure.md
      - Troubleshooting: gitops/troubleshooting.md
  - Features:
      - Global Variables: features/global-variables.md
      - Credentials: features/credentials.md
      - Templates: features/templates.md
  - API Reference:
      - Authentication: api/authentication.md
      - Workflows: api/workflows.md
      - Runs: api/runs.md
  - Guides:
      - Deploy to Kubernetes: guides/kubernetes-deploy.md
      - DNS Automation: guides/dns-automation.md
      - Database Provisioning: guides/database-provisioning.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
