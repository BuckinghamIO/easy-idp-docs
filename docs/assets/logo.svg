<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Git icon (abstract) -->
  <circle cx="30" cy="30" r="8" fill="url(#grad1)"/>
  <circle cx="70" cy="30" r="8" fill="url(#grad1)"/>
  <circle cx="50" cy="60" r="8" fill="url(#grad1)"/>
  
  <!-- Connecting lines -->
  <line x1="30" y1="30" x2="50" y2="60" stroke="url(#grad1)" stroke-width="3" opacity="0.6"/>
  <line x1="70" y1="30" x2="50" y2="60" stroke="url(#grad1)" stroke-width="3" opacity="0.6"/>
  <line x1="30" y1="30" x2="70" y2="30" stroke="url(#grad1)" stroke-width="3" opacity="0.6"/>
  
  <!-- Center dot (platform) -->
  <circle cx="50" cy="50" r="4" fill="#ffffff"/>
</svg>
